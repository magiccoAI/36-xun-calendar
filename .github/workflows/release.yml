name: Create Release and Package

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Package dist directory
      run: cd dist && zip -r ../36-xun-calendar-standalone.zip .

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          A new release of the 36-Xun Calendar.
          
          ## Standalone Version (Recommended)
          Download `36-xun-calendar-standalone.zip` below. Extract and double-click `index.html` to use. No installation required.
          
          ## Developer Version
          Clone the repository and run `npm install && npm run dev` for development.
        draft: false
        prerelease: false

    - name: Upload Release Asset
      id: upload-release-asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./36-xun-calendar-standalone.zip
        asset_name: 36-xun-calendar-standalone.zip
        asset_content_type: application/zip
